model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
model_reasoning_summary = "concise"
model_verbosity = "low"
personality = "pragmatic"
web_search = "live"
service_tier = "default"
suppress_unstable_features_warning = true
stream_idle_timeout_ms = 90000000
approval_policy = "never"
approvals_reviewer = "user"
sandbox_mode = "danger-full-access"

notify = [
  "/home/liufeng/.bun/bin/bun",
  "/home/liufeng/.confirmo/hooks/confirmo-codex-hook.js",
]

[features]
unified_exec = true
shell_snapshot = true
multi_agent = true
apps = true
prevent_idle_sleep = true
goals = true
memories = true
chronicle = false

[projects."/home/liufeng"]
trust_level = "trusted"

[projects."/home/liufeng/dotfiles"]
trust_level = "trusted"

[projects."/home/liufeng/dotfiles-private"]
trust_level = "trusted"

[projects."/home/liufeng/Code/self/knowledge"]
trust_level = "trusted"

[mcp_servers.chrome-devtools]
type = "stdio"
command = "npx"
args = ["chrome-devtools-mcp@latest"]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[launchers]
chrome_remote = "~/dotfiles/scripts/start-chrome-remote"

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[memories]
generate_memories = true
use_memories = true

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = true
keepRemoteControlAwakeWhilePluggedIn = true
appearanceTheme = "system"
localeOverride = "en-US"
preventSleepWhileRunning = true
followUpQueueMode = "queue"
dock-icon-preference = "app-default"
realtimeVoiceScreenContextEnabled = true

[desktop.appearanceLightChromeTheme]
accent = "#339cff"
contrast = 45
ink = "#1a1c1f"
opaqueWindows = false
surface = "#ffffff"

[desktop.appearanceLightChromeTheme.fonts]
code = "Hack Nerd Font Mono"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#00a240"
diffRemoved = "#ba2623"
skill = "#924ff7"

[desktop.appearanceDarkChromeTheme]
accent = "#339cff"
contrast = 60
ink = "#ffffff"
opaqueWindows = false
surface = "#181818"

[desktop.appearanceDarkChromeTheme.fonts]
code = "Hack Nerd Font Mono"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#40c977"
diffRemoved = "#fa423e"
skill = "#ad7bf9"

[desktop.open-in-target-preferences]
global = "ghostty"

[desktop.open-in-target-preferences.perPath]
"/home/liufeng/dotfiles" = "ghostty"
