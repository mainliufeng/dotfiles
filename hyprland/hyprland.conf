# This is an example Hyprland config file.
#
# Refer to the wiki for more information.

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,3072x1920@120Hz,0x0,auto
monitor=,highres,auto,2

xwayland {
  force_zero_scaling = false
}

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
# exec-once = xprop -root -f _XWAYLAND_GLOBAL_OUTPUT_SCALE 32c -set _XWAYLAND_GLOBAL_OUTPUT_SCALE 2
exec-once = waybar
exec-once = fcitx5
exec-once = mako -c ~/dotfiles/mako/config
exec-once = ~/dotfiles/mako/notify-log.py
# exec-once = flameshot
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = nm-applet --indicator
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.config/hypr/scripts/fix-gtk-portal-scale.sh
# wallpaper (random on login)
exec-once = $HOME/dotfiles/swww/scripts/wallpaper-random.sh
exec-once = $HOME/dotfiles/swww/scripts/wallpaper-rotate.sh & disown
# exec-once = hyprpaper
exec-once = hypridle & disown
exec-once = libinput-gestures-setup start
exec-once = ~/.config/hypr/scripts/start-xdp-desktop-portal.sh
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars.
env = XCURSOR_SIZE,16
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = GDK_SCALE,1
env = CHROME_EXTRA_ARGS,--force-device-scale-factor=1.0
env = ELECTRON_FORCE_DEVICE_SCALE_FACTOR,1.0

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options=ctrl:nocaps
    kb_rules =

    follow_mouse = 1

    touchpad {
        disable_while_typing = true
        natural_scroll = true
        tap-to-click = true
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

gesture = 4, swipe, workspace, distance: 100, invert: true

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 5
    border_size = 2
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    # col.inactive_border = rgba(595959aa)
    col.active_border = rgb(cdd6f4)
    col.inactive_border = rgba(595959aa)

    layout = master
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 1
    # blur = yes
    # blur_size = 4
    # blur_passes = 4
    # blur_new_optimizations = on
    blur {
        enabled = true
        size = 4
        passes = 4
        new_optimizations = true
    }

    # drop_shadow = yes
    shadow {
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.10, 0.9, 0.1, 1.05

    animation = windows, 1, 2, myBezier, slide
    animation = windowsOut, 1, 2, myBezier, slide
    animation = border, 1, 2, default
    animation = borderangle, 1, 2, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, default
    animation = specialWorkspace, 1, 2, myBezier, slidevert top
    animation = specialWorkspaceIn, 1, 2, myBezier, slidevert top
    animation = specialWorkspaceOut, 1, 2, myBezier, slidevert top
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = master
}

binds {
    scroll_event_delay = 10
}

misc {
}

# rules 
layerrule = blur on, match:namespace ^(lockscreen|hyprlock)$
#windowrulev2 = noblur,class:^(com.alibabainc.dingtalk)$
#windowrulev2 = noblur,class:^(tblive)$
windowrulev2 = animation slide,class:^(wofi)$
windowrulev2 = float,title:^AGENT\.md$
windowrulev2 = center,title:^AGENT\.md$
windowrulev2 = float,title:^Code Agents Config$
windowrulev2 = center,title:^Code Agents Config$
windowrulev2 = opacity 0.0 override,class:^(xwaylandvideobridge)$
windowrulev2 = noanim,class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus,class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1,class:^(xwaylandvideobridge)$
windowrulev2 = noblur,class:^(xwaylandvideobridge)$

# DingTalk (XWayland) may double its floating size on HiDPI; clamp main window only.
# (Avoid affecting DingTalk popups/dropdowns that may use the same WM_CLASS.)
windowrulev2 = size 1522 916,class:^com.alibabainc.dingtalk$,title:^钉钉$
windowrulev2 = maxsize 1522 916,class:^com.alibabainc.dingtalk$,title:^钉钉$
windowrulev2 = center,class:^com.alibabainc.dingtalk$,title:^钉钉$
#workspace = 5, on-created-empty:[float]

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod SHIFT, Return, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod SHIFT, R, forcerendererreload,
bind = $mainMod SHIFT, L, exec, ~/.config/hypr/scripts/lock.sh
# bind = $mainMod, E, exec, dolphin
bind = $mainMod, F, togglefloating,
bind = $mainMod, R, exec, ~/.config/hypr/scripts/launcher.sh
bind = $mainMod, V, exec, ~/.config/hypr/scripts/clipboard.sh
bind = $mainMod, N, exec, makoctl restore
bind = $mainMod SHIFT, N, exec, ~/dotfiles/mako/history-menu.sh
# bind = $mainMod SHIFT, R, exec, wofi --show drun --insensitive
bind = $mainMod, M, fullscreen, 1
bind = $mainMod SHIFT, M, fullscreen, 0
# bind = $mainMod, Minus, exec, guake

# screenshot
bind = , Print, exec, grim -g "$(slurp)" - | satty --filename -
bind = $mainMod, P, exec, grim -g "$(slurp)" - | satty --filename -
bind = $mainMod SHIFT, P, exec, grim - | satty --filename -

# Move focus with mainMod + arrow keys
# bind = $mainMod, h, movefocus, l
# bind = $mainMod, l, movefocus, r
# bind = $mainMod, k, movefocus, u
# bind = $mainMod, j, movefocus, d

bind = $mainMod, Return, layoutmsg, swapwithmaster master
bind = $mainMod, j, exec, ~/.config/hypr/scripts/cycle-focus-fullscreen.sh next
bind = $mainMod, k, exec, ~/.config/hypr/scripts/cycle-focus-fullscreen.sh prev
bind = $mainMod SHIFT, j, layoutmsg, swapnext
bind = $mainMod SHIFT, k, layoutmsg, swapprev
bind = $mainMod, i, layoutmsg, addmaster
bind = $mainMod, d, layoutmsg, removemaster
bind = ALT, Tab, focuscurrentorlast
bind = $mainMod, c, centerwindow
bind = $mainMod, c, resizeactive, exact 1300 800
bind = $mainMod, l, splitratio, +0.025
bind = $mainMod, h, splitratio, -0.025

# 如果是浮动窗口, super CONTROL + hjkl移动窗口
# bind = $mainMod CONTROL, h, exec, hyprctl activewindow | grep -q "floating: 1" && hyprctl dispatch moveactive -30 0
# bind = $mainMod CONTROL, l, exec, hyprctl activewindow | grep -q "floating: 1" && hyprctl dispatch moveactive 30 0
# bind = $mainMod CONTROL, k, exec, hyprctl activewindow | grep -q "floating: 1" && hyprctl dispatch moveactive 0 -15
# bind = $mainMod CONTROL, j, exec, hyprctl activewindow | grep -q "floating: 1" && hyprctl dispatch moveactive 0 15

bind = $mainMod CONTROL, j, focusmonitor, +1
bind = $mainMod CONTROL, k, focusmonitor, -1
bind = $mainMod SHIFT CONTROL, j, movecurrentworkspacetomonitor, +1
bind = $mainMod SHIFT CONTROL, k, movecurrentworkspacetomonitor, -1

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, Minus, togglespecialworkspace

# Media keys (volume / brightness)
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindle = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness.sh up 5
bindle = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh down 5

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, Minus, movetoworkspace, special

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
# Touchpad-friendly alternative: mainMod + SHIFT + LMB drag to resize
bindm = $mainMod SHIFT, mouse:272, resizewindow

# resize
bind= $mainMod SHIFT, R, submap, resize
submap=resize
binde=,l,resizeactive,30 0
binde=,h,resizeactive,-30 0
binde=,k,resizeactive,0 -30
binde=,j,resizeactive,0 30
bind=,escape,submap,reset 
bind=,Return,submap,reset 
submap=reset
