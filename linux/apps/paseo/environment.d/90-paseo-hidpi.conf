# HiDPI (eDP-1 3072x1920 @2x) with `xwayland:force_zero_scaling = true` in
# hyprland.conf: XWayland apps render 1:1, so each must scale its own UI.
# Paseo is an Electron app whose windows are spawned by paseo.service, not by
# Hyprland — so the variable has to reach the systemd user manager (this file),
# not just the desktop entry or the compositor's env.

# Prefer Wayland over XWayland for Paseo's windows: on Wayland the compositor
# reports the scale (2x here), so the app is sharp AND correctly sized without
# any per-app flag. XWayland is the fallback if this build ignores it.
ELECTRON_OZONE_PLATFORM_HINT=auto

# Paseo (Electron) does not honour the X DPI hints above, so it needs the scale
# explicitly. Its launcher rejects Chromium flags and scrubs the environment for
# the window it spawns through systemd, so the variable is set for the whole
# user manager — that is the only channel that reaches the app.
