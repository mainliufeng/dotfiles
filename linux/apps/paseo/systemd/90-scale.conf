# Paseo must scale itself from the X DPI hints (xsettingsd publishes Xft/DPI=192,
# see the xsettingsd user service) — that is the mechanism that keeps its UI both
# sharp and correctly sized on this 2x panel.
#
# ELECTRON_FORCE_DEVICE_SCALE_FACTOR is the *other* lever, but it overrides the
# DPI hints instead of combining with them, and this machine also exports it in
# the session environment, which would make Paseo 4x (or 1x, depending on which
# value wins). Unset it for this service so there is exactly one source of scale.
[Service]
UnsetEnvironment=ELECTRON_FORCE_DEVICE_SCALE_FACTOR
