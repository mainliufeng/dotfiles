# Native Wayland reports the monitor scale, including the laptop's 2x panel.
# Xwayland with force_zero_scaling renders this app at half size instead.
# Do not add a fixed device scale on top of the native Wayland output scale.
--ozone-platform=wayland
--enable-wayland-ime
--force-renderer-accessibility

# Route through local Clash Verge (direct chatgpt.com is blocked)
--proxy-server=http://127.0.0.1:7897
--proxy-bypass-list=<local>;127.0.0.1;localhost;*.ts.net
