# Every Chrome launch reads this file (Arch's google-chrome wrapper):
#   CHROME_USER_FLAGS="$(grep -v '^#' ~/.config/chrome-flags.conf)"
#
# HiDPI, paired with `xwayland:force_zero_scaling = true` in hyprland.conf:
# Chromium renders at 1x there, so it has to be told to scale its own UI —
# without this the window is sharp but half size.
--force-device-scale-factor=2
