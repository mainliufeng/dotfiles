# Extra flags passed to Google Chrome (see /usr/bin/google-chrome-stable wrapper).
#
# Keep this file free of per-session scaling tweaks, otherwise it affects both
# KDE/Xorg and Hyprland/Wayland. Per-session scaling is handled in the desktop
# entry override under ~/dotfiles/linux/apps/chrome/applications/.
--enable-wayland-ime
--wayland-text-input-version=1
--enable-features=VerticalTabs
