# fcitx5's candidate window is a Qt/X11 window, and this session runs
# `xwayland:force_zero_scaling = true` — the compositor no longer scales XWayland
# surfaces, so the candidates are drawn at 1x and look half size on this 2x panel.
#
# Measured: with the default size the candidate window was 205x19 logical px with
# ~16 physical px of text, against ~26 px in the bar and 28-32 px in normal app
# text. PerScreenDPI did not change that here (XWayland reports a DPI fcitx5
# ignores), so the size is set explicitly — 24pt renders ~32 px, i.e. twice.
Font="Sans 24"
Vertical Candidate List=False
