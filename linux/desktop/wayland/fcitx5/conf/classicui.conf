# fcitx5's candidate window is an X11 window (the process only connects to X11),
# and this session runs with `xwayland:force_zero_scaling = true` so the
# compositor no longer scales XWayland surfaces. Without the following the
# candidates are drawn at 1x and look tiny on this 2x panel.
#
# PerScreenDPI makes fcitx5 size its panel from the screen DPI itself; the font
# below is the fallback size used when that scaling is not enough.
PerScreenDPI=True
Font="Sans 12"
Vertical Candidate List=False
