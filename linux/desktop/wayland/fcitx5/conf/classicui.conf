# fcitx5's candidate window is a Qt/X11 window. This session runs
# `xwayland:force_zero_scaling = true`, so the compositor no longer scales
# XWayland surfaces — without the following, the candidates are drawn at 1x and
# look tiny on this 2x panel.
#
# PerScreenDPI makes fcitx5 size its panel from the reported screen DPI; the font
# is an explicit fallback. If the candidates end up too large, drop
# PerScreenDPI; if still too small, raise the font size.
PerScreenDPI=True
Font="Sans 12"
Vertical Candidate List=False
