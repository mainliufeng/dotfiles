# This is an example Hyprland config file.
#
# Refer to the wiki for more information.

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# cornice CLI. Absolute on purpose: the Hyprland session PATH does not
# necessarily contain ~/.local/bin, and sh expands $HOME for us.
$cornice = sh -c 'exec "$HOME/.local/bin/cornice" "$@"' cornice

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,3072x1920@120Hz,0x0,auto
monitor=,highres,auto,2

xwayland {
  # 2x panel (eDP-1 3072x1920). false = Hyprland upscales XWayland buffers from
  # 1x: right size, visibly blurry text. true = apps render 1:1 and stay sharp,
  # so each XWayland app must scale its own UI to 2x:
  #   Chrome -> --force-device-scale-factor=2, set in ~/.config/chrome-flags.conf
  #   Paseo  -> ELECTRON_FORCE_DEVICE_SCALE_FACTOR=2, set in its .desktop entry
  # (and session-wide for other Electron apps, see the env line below).
  # Any other XWayland app would appear half size; set this back to false if a
  # 1x external monitor is ever attached.
  force_zero_scaling = true
}

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
# exec-once = xprop -root -f _XWAYLAND_GLOBAL_OUTPUT_SCALE 32c -set _XWAYLAND_GLOBAL_OUTPUT_SCALE 2
# Waybar is replaced by the cornice shell (a single Quickshell process that also
# draws notifications, panels and the OSD). Rollback: comment cornice-launch
# below and uncomment waybar.
# exec-once = waybar
# cornice is a systemd user service now, so it is restarted automatically when it
# dies (an exec-once line cannot do that — a killed shell used to mean no bar
# until the next login). Enable it once:
#   systemctl --user enable --now cornice
# The unit ships in the cornice repo as config/cornice.service.
# exec-once = sh -c 'exec "$HOME/.local/bin/cornice-launch"'
# Publish the 2x DPI to XWayland apps (what KWin does automatically on Plasma).
# Without it Chromium/Electron apps believe they are on a 1x screen, which is why
# Paseo rendered its UI tiny while the compositor drew everything crisply.
exec-once = sh -c 'exec xsettingsd -c "$HOME/.config/xsettingsd/xsettingsd.conf"'
exec-once = sh -c 'for i in $(seq 1 20); do xprop -root -f _XWAYLAND_GLOBAL_OUTPUT_SCALE 32c -set _XWAYLAND_GLOBAL_OUTPUT_SCALE 2 2>/dev/null && break; sleep 0.5; done'
exec-once = fcitx5
# Clash Verge (proxy). Its ~/.config/autostart entry never fires: a plain
# Hyprland session does not process XDG autostart (xdg-desktop-autostart.target
# is inactive). Starting it here is the same thing minus the KDE/GNOME extras
# that a blanket autostart target would also pull in.
exec-once = /usr/bin/clash-verge
# mako is replaced by the cornice notification daemon (it owns the same bus name).
# mako.service is a systemd *user* unit, so it must be disabled there too — the
# commented exec-once below is not enough:
#   systemctl --user disable --now mako.service
# exec-once = mako -c ~/dotfiles/linux/desktop/mako/config
exec-once = ~/dotfiles/linux/desktop/mako/notify-log.py
# exec-once = flameshot
# polkit agent: cornice draws the authentication dialog now (only one agent can be
# registered at a time). Rollback: comment cornice's line, uncomment this.
# exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = nm-applet --indicator
# blueman-applet is unstable on some Wayland setups; use waybar custom bluetooth module instead.
# exec-once = blueman-applet
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.config/hypr/scripts/fix-gtk-portal-scale.sh
# wallpaper (video)
# Video wallpaper is off: it keeps a decoder running the whole session (battery).
# cornice's background layer draws a static image instead (Super+Alt+W cycles).
# Rollback: uncomment the mpvpaper line (cornice will step aside automatically).
# exec-once = mpvpaper -o "no-audio loop-playlist=inf --fullscreen --panscan=1" ALL ~/dotfiles/wallpaper/videos/
#exec-once = mpvpaper -o "loop-playlist=inf --fullscreen --panscan=1 --ao=pipewire --volume=20 " ALL ~/dotfiles/wallpaper/videos/
# exec-once = hyprpaper
# Idle handling moved into the cornice shell (cn.idle): dim / display off / lock,
# AC-battery aware and honouring idle inhibitors. Rollback: uncomment hypridle.
# exec-once = hypridle & disown
exec-once = libinput-gestures-setup start
# Bare Hyprland does not process ~/.config/autostart (xdg-desktop-autostart.target
# is never activated in this session), so the entries that matter are started
# explicitly here instead.
exec-once = ~/.local/bin/chrome-agent
exec-once = systemctl --user start paseo.service
exec-once = /usr/bin/rustdesk --tray

exec-once = ~/.config/hypr/scripts/start-xdp-desktop-portal.sh
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars.
env = XCURSOR_SIZE,16
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = GDK_SCALE,1
env = CHROME_EXTRA_ARGS,--force-device-scale-factor=1.0

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options=ctrl:nocaps
    kb_rules =

    follow_mouse = 1

    touchpad {
        disable_while_typing = true
        natural_scroll = true
        tap-to-click = true
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

gesture = 4, swipe, workspace, distance: 100, invert: true

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 5
    border_size = 4
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(444444cc)

    layout = master
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 1
    # blur = yes
    # blur_size = 4
    # blur_passes = 4
    # blur_new_optimizations = on
    blur {
        enabled = false
        size = 4
        passes = 4
        new_optimizations = true
    }

    # drop_shadow = yes
    shadow {
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

group {
    col.border_active = rgba(00c8ffff)
    col.border_inactive = rgba(2b3b4acc)
    col.border_locked_active = rgba(ff8a00ff)
    col.border_locked_inactive = rgba(5a2f00cc)

    groupbar {
        height = 20
        font_size = 11
        font_weight_active = bold
        font_weight_inactive = normal
        gradients = true
        text_color = rgba(ffffffff)
        text_color_inactive = rgba(c0c0c0ff)
        text_color_locked_active = rgba(ffffffff)
        text_color_locked_inactive = rgba(ffddbbff)
        indicator_height = 4
        col.active = rgba(2b8cffff)
        col.inactive = rgba(1f232aff)
        col.locked_active = rgba(ff8a00ff)
        col.locked_inactive = rgba(5a2f00ff)
    }
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.10, 0.9, 0.1, 1.05

    animation = windows, 1, 2, myBezier, slide
    animation = windowsOut, 1, 2, myBezier, slide
    animation = border, 1, 2, default
    animation = borderangle, 1, 2, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, default
    animation = specialWorkspace, 1, 2, myBezier, slidevert top
    animation = specialWorkspaceIn, 1, 2, myBezier, slidevert top
    animation = specialWorkspaceOut, 1, 2, myBezier, slidevert top
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    # `pseudotile` was removed from Hyprland in 0.55; pseudotiling is now a
    # per-window state (hyprctl dispatch pseudo). The old global switch was
    # inert and made Hyprland log a config error on every start.
    preserve_split = true # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = master
}

binds {
    scroll_event_delay = 10
}

misc {
}

# rules 
layerrule = blur on, match:namespace ^(lockscreen|hyprlock)$
#windowrule = no_blur on, match:class ^(com.alibabainc.dingtalk)$
#windowrule = no_blur on, match:class ^(tblive)$
windowrule = animation slide, match:class ^(wofi)$
windowrule = float on, match:class ^(confirmo)$
windowrule = pin on, match:class ^(confirmo)$
windowrule = float on, match:title ^AGENT\.md$
windowrule = center on, match:title ^AGENT\.md$
windowrule = float on, match:title ^Code Agents Config$
windowrule = center on, match:title ^Code Agents Config$
# ChatGPT's XWayland confirm dialog ("Quit ChatGPT?") opens at 0,0 — floating,
# but under the bar — so float+centre just that window. Its class is `ChatGPT`
# while the main window is `Chatgpt`, so the main window keeps tiling.
windowrule = float on, match:class ^(ChatGPT)$
windowrule = center on, match:class ^(ChatGPT)$
windowrule = no_initial_focus on, match:class ^(ChatGPT)$

windowrule = opacity 0.0 override, match:class ^(xwaylandvideobridge)$
windowrule = no_anim on, match:class ^(xwaylandvideobridge)$
windowrule = no_initial_focus on, match:class ^(xwaylandvideobridge)$
windowrule = max_size 1 1, match:class ^(xwaylandvideobridge)$
windowrule = no_blur on, match:class ^(xwaylandvideobridge)$

# DingTalk (XWayland) may double its floating size on HiDPI; clamp main window only.
# (Avoid affecting DingTalk popups/dropdowns that may use the same WM_CLASS.)
windowrule = size 1522 916, match:class ^com.alibabainc.dingtalk$, match:title ^钉钉$
windowrule = max_size 1522 916, match:class ^com.alibabainc.dingtalk$, match:title ^钉钉$
windowrule = center on, match:class ^com.alibabainc.dingtalk$, match:title ^钉钉$
#workspace = 5, on-created-empty:[float]

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod SHIFT, Return, exec, ghostty
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod SHIFT, R, forcerendererreload,
bind = $mainMod SHIFT, L, exec, ~/.config/hypr/scripts/lock.sh
# bind = $mainMod, E, exec, dolphin
bind = $mainMod, F, togglefloating,
# launcher: was ~/.config/hypr/scripts/launcher.sh (wofi)
bind = $mainMod, R, exec, $cornice launcher
bind = $mainMod, O, exec, ~/.config/hypr/scripts/workspace-project.sh
# clipboard: was ~/.config/hypr/scripts/clipboard.sh (wofi + cliphist)
bind = $mainMod, V, exec, $cornice clipboard
bind = $mainMod, E, exec, $cornice emojis
# notification centre (was: makoctl restore)
bind = $mainMod, N, exec, $cornice notifications
# notification history (was: ~/dotfiles/linux/desktop/mako/history-menu.sh)
bind = $mainMod SHIFT, N, exec, $cornice notifications
# bind = $mainMod SHIFT, R, exec, wofi --show drun --insensitive
bind = $mainMod, M, fullscreen, 1
bind = $mainMod SHIFT, M, fullscreen, 0
# bind = $mainMod, Minus, exec, guake

# cornice shell: panels, do-not-disturb, OSD and restarts.
# SUPER + ALT is free in this config; everything else stays as it was.
bind = $mainMod ALT, A, exec, $cornice panel cn.audio
bind = $mainMod ALT, W, exec, $cornice panel cn.network
bind = $mainMod ALT, B, exec, $cornice panel cn.bluetooth
bind = $mainMod ALT, C, exec, $cornice panel cn.clock
bind = $mainMod ALT, P, exec, $cornice panel cn.power
bind = $mainMod ALT, D, exec, $cornice dnd
bind = $mainMod ALT, W, exec, $cornice background next   # 静态壁纸换一张
bind = $mainMod ALT, T, exec, $cornice theme toggle      # 亮色/暗色主题切换
bind = $mainMod ALT, V, exec, $cornice osd volume
bind = $mainMod ALT, R, exec, $cornice restart

# screenshot
bind = , Print, exec, grim -g "$(slurp)" - | satty --filename -
bind = $mainMod, P, exec, grim -g "$(slurp)" - | satty --filename -
bind = $mainMod SHIFT, P, exec, grim - | satty --filename -

# Move focus with mainMod + arrow keys
# bind = $mainMod, h, movefocus, l
# bind = $mainMod, l, movefocus, r
# bind = $mainMod, k, movefocus, u
# bind = $mainMod, j, movefocus, d

bind = $mainMod, Return, layoutmsg, swapwithmaster master
bind = $mainMod, j, exec, ~/.config/hypr/scripts/cycle-focus-fullscreen.sh next
bind = $mainMod, k, exec, ~/.config/hypr/scripts/cycle-focus-fullscreen.sh prev
bind = $mainMod, Y, exec, hyprctl dispatch pin
bind = $mainMod SHIFT, j, layoutmsg, swapnext
bind = $mainMod SHIFT, k, layoutmsg, swapprev
bind = $mainMod, i, exec, ~/.config/hypr/scripts/layoutmsg-active.sh addmaster
bind = $mainMod, d, exec, ~/.config/hypr/scripts/layoutmsg-active.sh removemaster

# Group (tabbed) windows
bind = $mainMod, G, togglegroup
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b
bind = $mainMod CONTROL, G, lockactivegroup, toggle
bind = $mainMod SHIFT, G, lockgroups, toggle

bind = ALT, Tab, focuscurrentorlast
bind = $mainMod, c, centerwindow
bind = $mainMod, c, resizeactive, exact 1300 800
bind = $mainMod, l, exec, ~/.config/hypr/scripts/layoutmsg-active.sh mfact +0.025
bind = $mainMod, h, exec, ~/.config/hypr/scripts/layoutmsg-active.sh mfact -0.025

# 如果是浮动窗口, super CONTROL + hjkl移动窗口
# bind = $mainMod CONTROL, h, exec, hyprctl activewindow | grep -q "floating: 1" && hyprctl dispatch moveactive -30 0
# bind = $mainMod CONTROL, l, exec, hyprctl activewindow | grep -q "floating: 1" && hyprctl dispatch moveactive 30 0
# bind = $mainMod CONTROL, k, exec, hyprctl activewindow | grep -q "floating: 1" && hyprctl dispatch moveactive 0 -15
# bind = $mainMod CONTROL, j, exec, hyprctl activewindow | grep -q "floating: 1" && hyprctl dispatch moveactive 0 15

bind = $mainMod CONTROL, j, exec, ~/.config/hypr/scripts/cycle-focus-fullscreen.sh next all
bind = $mainMod CONTROL, k, exec, ~/.config/hypr/scripts/cycle-focus-fullscreen.sh prev all
bind = $mainMod SHIFT CONTROL, j, movecurrentworkspacetomonitor, +1
bind = $mainMod SHIFT CONTROL, k, movecurrentworkspacetomonitor, -1

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, Minus, togglespecialworkspace

# Media keys (volume / brightness)
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindle = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness.sh up 5
bindle = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh down 5

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, Minus, movetoworkspace, special

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
# Touchpad-friendly alternative: mainMod + SHIFT + LMB drag to resize
bindm = $mainMod SHIFT, mouse:272, resizewindow

# resize
bind= $mainMod SHIFT, R, submap, resize
submap=resize
binde=,l,resizeactive,30 0
binde=,h,resizeactive,-30 0
binde=,k,resizeactive,0 -30
binde=,j,resizeactive,0 30
bind=,escape,submap,reset 
bind=,Return,submap,reset 
submap=reset
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# Hyprvoice: independent local voice input, with existing Fcitx Pinyin retained.
source = ~/dotfiles/linux/desktop/hyprland/hyprvoice.conf
exec-once = ~/.config/hypr/scripts/hyprvoice-session.sh

# Cornice service startup (rollback: cornice takeover --undo)
source = ~/dotfiles/linux/desktop/hyprland/cornice-service.conf
