# Start Cornice in this login even when graphical-session.target is inactive.
# This opt-in marker rejects a known incompatible system fallback. Only a NEW
# system Hyprland login executes this command; a config reload does not execute
# exec-once again. Immutable session-trial releases use their own configuration.
# Pair the marker with cornice-legacy-fallback.conf so graphical-session.target
# cannot start the legacy shell independently of this login command.
exec-once = sh -c 'if [ -e "$HOME/.local/state/cornice/session-trial/deny-legacy-fallback" ]; then exec hyprctl dispatch exit; fi; systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP && systemctl --user start cornice.service'
