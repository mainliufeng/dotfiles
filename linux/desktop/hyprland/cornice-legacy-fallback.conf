# Install as ~/.config/systemd/user/cornice.service.d/90-no-legacy-fallback.conf.
# The immutable paired login supervises its own shell; this unit belongs only
# to the system fallback. Reloading units does not stop its current process.
[Unit]
ConditionPathExists=!%h/.local/state/cornice/session-trial/deny-legacy-fallback
