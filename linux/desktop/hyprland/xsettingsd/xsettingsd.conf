# Published to XWayland apps (GTK, Electron, …) as XSETTINGS.
#
# This is the piece Plasma gets for free from KWin: XWayland apps are told the
# real DPI, so they scale their own UI. Hyprland does not do it, which is why
# Chromium/Electron apps otherwise believe they are on a 1x screen — the reason
# Paseo looked tiny while the compositor rendered everything crisply.
#
# 192 dpi = 2x on this panel (3072x1920).
Xft/DPI 196608
Gdk/WindowScalingFactor 2
