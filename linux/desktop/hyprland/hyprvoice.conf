# Legacy hyprlang configuration; do not load alongside the Lua bindings.
bind = , F8, exec, ~/.local/bin/hyprvoice press
bindr = , F8, exec, ~/.local/bin/hyprvoice release
bind = , F9, exec, ~/.local/bin/hyprvoice command
bindr = , F9, exec, ~/.local/bin/hyprvoice stop
bind = SUPER ALT, Return, exec, ~/.local/bin/hyprvoice commit
bind = SUPER ALT, O, exec, ~/.local/bin/hyprvoice raw
bind = SUPER ALT, Escape, exec, ~/.local/bin/hyprvoice cancel
bind = SUPER ALT, 1, exec, ~/.local/bin/hyprvoice scene raw
bind = SUPER ALT, 2, exec, ~/.local/bin/hyprvoice scene correct
bind = SUPER ALT, 3, exec, ~/.local/bin/hyprvoice scene format
bind = SUPER ALT, 4, exec, ~/.local/bin/hyprvoice scene translate
