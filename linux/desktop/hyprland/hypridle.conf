# Idle behaviour, mirroring the KDE power profile this session replaces:
#
#   AC        dim 60s, display off 120s, never suspend
#   Battery   display off 300s, never suspend
#   Lock      after 5 minutes (Plasma's default), display off 10s later
#
# AutoSuspendAction is 0 in the user's powerdevilrc, so nothing here suspends —
# the machine only sleeps when explicitly asked.
general {
  lock_cmd = ~/.config/hypr/scripts/lock.sh
  before_sleep_cmd = ~/.config/hypr/scripts/lock.sh
  after_sleep_cmd = ~/.config/hypr/scripts/idle.sh display-on
}

# AC only: dim the backlight first, like PowerDevil's DimDisplayIdleTimeoutSec.
listener {
  timeout = 60
  on-timeout = ~/.config/hypr/scripts/idle.sh dim --if-ac
  on-resume = ~/.config/hypr/scripts/idle.sh undim
}

# AC only: display off at two minutes.
listener {
  timeout = 120
  on-timeout = ~/.config/hypr/scripts/idle.sh display-off --if-ac
  on-resume = ~/.config/hypr/scripts/idle.sh display-on
}

# Lock at five minutes, then display off (KDE turns the display off 10s after
# locking).
listener {
  timeout = 300
  on-timeout = ~/.config/hypr/scripts/lock.sh
}

listener {
  timeout = 310
  on-timeout = ~/.config/hypr/scripts/idle.sh display-off
  on-resume = ~/.config/hypr/scripts/idle.sh display-on
}

# Battery: display off at five minutes even before the locker engages.
listener {
  timeout = 300
  on-timeout = ~/.config/hypr/scripts/idle.sh display-off --if-battery
  on-resume = ~/.config/hypr/scripts/idle.sh display-on
}
