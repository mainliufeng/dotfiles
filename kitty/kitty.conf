# kitty config shared for macOS + Linux

font_family      Hack Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# sane default; override per-machine by creating current-theme.conf / local.conf
font_size 12.0

cursor_shape block
scrollback_lines 50000
background_opacity 0.8

# Theme (optional)
include current-theme.conf

# Local overrides (optional)
include local.conf
