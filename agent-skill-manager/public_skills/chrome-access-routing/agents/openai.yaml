interface:
  display_name: "Chrome Access Routing"
  short_description: "Route Chrome access safely"
  default_prompt: "Use $chrome-access-routing to choose the best route for Chrome or browser access. On macOS use Computer Use for Google Chrome first for real visible Chrome windows, GSC/Google Search Console, logged-in Google services, authenticated dashboards, and any case where the user says the page is already open or logged in. Treat Chrome Extension/headless signed-out or account-chooser state as route-specific until Computer Use checks real Chrome. Use extension/plugin tools only when real login/current-window state is not required or after Computer Use confirms the surface. Use Browser/headless routes for local app QA without real profile needs, and CDP only when 127.0.0.1:9222 is available. On Linux prefer web-access/headless/curl routes. If one route fails, name it and try another viable route before giving up."
